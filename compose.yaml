x-app: &app
  build:
    context: .
    args:
      REGISTRY: ${DOCKER_REGISTRY:-docker.arvancloud.ir}
      APK_MIRROR: ${APK_MIRROR:-https://mirror.arvancloud.ir/alpine}
      COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
  image: wallgold-price-alerts:local
  # The application reads .env as a file (not as injected variables), so the
  # test suite's own settings in phpunit.xml still take precedence inside the
  # container. Service hostnames, ports and drivers are pinned here so a .env
  # edited for bare metal cannot break the stack; `make test` unsets the
  # drivers before running PHPUnit.
  volumes:
    - type: bind
      source: ./.env
      target: /app/.env
      read_only: true
      bind:
        create_host_path: false   # fail clearly when .env is missing instead of creating a directory
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
  restart: unless-stopped

x-depends: &depends
  migrate:
    condition: service_completed_successfully
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force", "--seed"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    <<: *app
    depends_on: *depends
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # One watcher polls the feed and pops the index; scale workers as the mail
  # volume requires (docker compose up -d --scale worker=4).
  watcher:
    <<: *app
    command: ["php", "artisan", "price:watch", "-v"]
    depends_on: *depends

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=alerts,default", "--sleep=0.1", "--tries=3", "--timeout=60", "--max-time=3600"]
    depends_on: *depends

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on: *depends

  redis:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback only: the worker deserialises whatever lands on the queue, so
      # Redis must never be reachable from the network.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wallgold}
      MYSQL_USER: ${DB_USERNAME:-wallgold}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:
